name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vectors:
    name: Vectors match selcom-spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: tests/vectors is byte-identical to selcom-spec at the tag in SPEC_VERSION
        run: node scripts/check-vectors.mjs

  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Lint and format
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Smoke-test the built package (ESM and CJS)
        run: |
          node --input-type=module -e "import('@selcom-developers/selcom').then(m => { if (typeof m.SelcomClient !== 'function') process.exit(1); })"
          node -e "const m = require('@selcom-developers/selcom'); if (typeof m.SelcomClient !== 'function') process.exit(1)"
      - name: Check package exports and types
        if: matrix.node == 24
        run: npm run check:package
